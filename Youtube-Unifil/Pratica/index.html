<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Youtube-Unifil</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="cabecalho">
            <div class="cab-ini">
                <div class="logotipo">
                    <i class="fa-solid fa-bars"></i>
                    <div class="logotipos">
                        <i class="fa-brands fa-youtube logotipo-icone"></i>
                        <p class="logotipo-nome">Youtube</p>
                        <p class="logotipo-pais">BR</p>
                    </div>
                    
                </div>
            
            </div>
            
            <div class="cab-meio">
                <div class="search">
                    <input type="text" name="search" id="search-input" class="search-input" placeholder="Pesquisar">
                    <button class="search-button">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div> 
                
                <button class="microphone">
                    <i class="fa-solid fa-microphone"></i>
                </button> 
            </div>
            
            <div class="cab-fim">
                <button class="logotipo-video" title="criar">
                    <i class="fa-solid fa-video"></i>
                </button>
                
                <button class="logotipo-video" title="notificacoes">
                    <i class="fa-solid fa-bell"></i>
                </button>
                
                <button class="logotipo-video" title="suaConta">
                    v
                </button>
            </div>
        </header>
        
        <script src="java.js"></script>
    </body>
</html>
